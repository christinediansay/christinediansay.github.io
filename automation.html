<style>
:root{--dark:#0F1A16;--soft:#5FAF8C;--mint:#7EE0B0;--text:#F6F7F4;--muted:#A9BCB3}
*{box-sizing:border-box;margin:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(900px 480px at 85% -10%,rgba(126,224,176,.12),transparent 60%),var(--dark);color:var(--text);min-height:100vh;display:grid;place-items:center;padding:40px 20px;-webkit-font-smoothing:antialiased}
main{max-width:640px;text-align:center}
.lab{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--soft)}
h1{font-size:clamp(30px,5vw,46px);line-height:1.08;letter-spacing:-.03em;font-weight:800;margin-top:12px}
p.lead{color:var(--muted);font-size:17px;margin-top:16px;line-height:1.55}
.btn{display:inline-block;margin-top:28px;padding:13px 22px;border-radius:12px;font-weight:700;color:var(--dark);text-decoration:none;background:linear-gradient(180deg,#A6F0CB,var(--mint));box-shadow:0 8px 24px rgba(126,224,176,.35)}
.mail{display:block;margin-top:14px;color:var(--muted);font-size:14px}
.back{display:inline-block;margin-top:30px;color:var(--muted);font-size:14px;font-weight:600;text-decoration:none}
.back:hover{color:var(--mint)}
:focus-visible{outline:3px solid var(--mint);outline-offset:3px;border-radius:8px}
</style>
</head>
<body>
<main>
  <p class="lab">Automation (GHL + AI)</p>

  <a class="back" href="index.html">← See what else I handle</a>
